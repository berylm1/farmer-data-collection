# FarmConnect Platform — Complete Production Stack
# Generated from guide + actual source inventory (64+ services)
# Deploy: docker compose -f docker-compose.clean.yml up -d
# Layer-by-layer: see guide Section 8

services:
  # ============================================================
  # LAYER 1: DATA STORES (no deps)
  # ============================================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: farmer-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: farmer_data
      POSTGRES_USER: ${DB_USER:-farmer_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./drizzle/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${DB_USER:-farmer_user}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    networks:
      - farmconnect-network
    dns_search:
      - .

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.22.0
    container_name: farmer-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      PGBOUNCER_DATABASE: farmer_data
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_MIN_POOL_SIZE: "5"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: "statement_timeout"
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: ${DB_USER:-farmer_user}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      POSTGRESQL_DATABASE: farmer_data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRESQL_PASSWORD psql -h localhost -p 6432 -U $$POSTGRESQL_USERNAME -d farmer_data -tAc \"SELECT 1\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - farmconnect-network
    dns_search:
      - .

  redis:
    image: redis:7-alpine
    container_name: farmer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --save 60 1000
      --save 300 100
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    networks:
      - farmconnect-network
    dns_search:
      - .

  kafka:
    image: apache/kafka:3.7.0
    container_name: farmer-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - farmconnect-network
    dns_search:
      - .

  # ============================================================
  # LAYER 2: AUTH & ACCESS CONTROL (needs PG)
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: farmer-keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:MaxRAMPercentage=75"
      PERMIFY_LOG_LEVEL: info
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmconnect-network
    dns_search:
      - .

  permify:
    image: ghcr.io/permify/permify:latest
    container_name: farmer-permify
    restart: unless-stopped
    ports:
      - "3476:3476"
      - "3478:3478"
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/permify?sslmode=disable"
      PERMIFY_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3476/healthz | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - farmconnect-network
    dns_search:
      - .

  temporal:
    image: temporalio/auto-setup:1.23.1
    container_name: farmer-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${DB_USER:-farmer_user}
      POSTGRES_PWD: ${DB_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - farmconnect-network
    dns_search:
      - .

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: farmer-temporal-ui
    restart: unless-stopped
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - farmconnect-network
    dns_search:
      - .

  # ============================================================
  # LAYER 3: SEARCH & API GATEWAY (standalone)
  # ============================================================
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: farmer-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      plugins.security.disabled: "false"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - farmconnect-network
    dns_search:
      - .

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: farmer-opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - farmconnect-network
    dns_search:
      - .

  apisix:
    image: apache/apisix:3.7.0-debian
    container_name: farmer-apisix
    restart: unless-stopped
    ports:
      - "9080:9080"
      - "9180:9180"
    volumes:
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    environment:
      APISIX_STAND_ALONE: "true"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - farmconnect-network
    dns_search:
      - .

  openappsec:
    image: ghcr.io/openappsec/smartsync:latest
    container_name: farmer-openappsec
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      LEARNING_MODE: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - farmconnect-network
    dns_search:
      - .

  # ============================================================
  # LAYER 4: FINANCIAL & WORKFLOW (standalone)
  # ============================================================
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.9
    container_name: farmer-tigerbeetle
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle
    volumes:
      - tigerbeetle-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    security_opt:
      - seccomp=unconfined
    networks:
      - farmconnect-network
    dns_search:
      - .

  fluvio:
    image: infinyon/fluvio:latest
    container_name: farmer-fluvio
    restart: unless-stopped
    ports:
      - "9003:9003"
    environment:
      FLUVIO_NODE_BIND_ADDR: 0.0.0.0:9003
    volumes:
      - fluvio-data:/var/lib/fluvio
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - farmconnect-network
    dns_search:
      - .

  dapr-placement:
    image: daprio/dapr:1.13.0
    container_name: farmer-dapr-placement
    restart: unless-stopped
    command: ["./placement", "--port", "50005"]
    ports:
      - "50005:50005"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50005 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - farmconnect-network
    dns_search:
      - .

  mojaloop-simulator:
    image: mojaloop/simulator:latest
    container_name: farmer-mojaloop
    restart: unless-stopped
    ports:
      - "8444:8444"
    environment:
      PARTIES_ENDPOINT: http://mojaloop-simulator:8444
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8444/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - farmconnect-network
    dns_search:
      - .

  # ============================================================
  # LAYER 5: OBSERVABILITY (standalone)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: farmer-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - farmconnect-network
    dns_search:
      - .

  grafana:
    image: grafana/grafana:10.4.0
    container_name: farmer-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - farmconnect-network
    dns_search:
      - .

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: farmer-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - farmconnect-network
    dns_search:
      - .

  loki:
    image: grafana/loki:2.9.3
    container_name: farmer-loki
    restart: unless-stopped
    ports:
      - "3101:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - farmconnect-network
    dns_search:
      - .

  promtail:
    image: grafana/promtail:2.9.3
    container_name: farmer-promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - farmconnect-network
    dns_search:
      - .

  vault:
    image: hashicorp/vault:1.15
    container_name: farmer-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://vault:8200"
    volumes:
      - vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - farmconnect-network
    dns_search:
      - .

  # ============================================================
  # LAYER 6: MAIN API (needs PG + Redis)
  # ============================================================
  app:
    image: farmconnect/api:latest
    container_name: farmer-app
    restart: unless-stopped
    ports:
      - "3000:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/farmer_data
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      PERMIFY_ENDPOINT: http://farmer-permify:3476
      OPENSEARCH_URL: http://opensearch:9200
      TEMPORAL_ADDRESS: temporal:7233
      TIGERBEETLE_ADDRESS: tigerbeetle:3000
      MOJALOOP_API_URL: http://mojaloop-simulator:8444
      DAPR_HOST: dapr-placement
      DAPR_HTTP_PORT: 3500
      APISIX_ADMIN_URL: http://apisix:9180
      FLUVIO_URL: http://fluvio:9003
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_CURRENCY: NGN
      ALLOWED_ORIGINS: "https://america.tail3a833f.ts.net,http://america:9080,http://america:3000,http://100.79.80.119:9080,http://100.79.80.119:3000,http://100.79.80.119:3001,http://localhost:9080,http://localhost:3000,http://localhost:3001,http://localhost:5173"
      FEATURE_FLAGS_SERVICE_URL: http://farmer-feature-flags:8101
      WHATSAPP_SERVICE_URL: http://farmer-whatsapp-service:8102
      QR_TRACEABILITY_SERVICE_URL: http://farmer-qr-traceability:8103
      TILE_CACHE_URL: http://farmer-tile-cache:8097
      GPS_STREAMING_SERVICE_URL: http://farmer-gps-streaming:8098
      SPATIAL_QUERY_SERVICE_URL: http://farmer-spatial-queries:8099
      GEOCODING_SERVICE_URL: http://farmer-geocoding:8100
      SEARCH_SERVICE_URL: http://farmer-search-proxy:8104
      WAF_SERVICE_URL: http://farmer-waf-security:8105
      FLUVIO_SERVICE_URL: http://farmer-fluvio-streaming:8106
      WEATHER_SERVICE_URL: http://farmer-weather-alerts:8107
      CREDIT_SCORING_SERVICE_URL: http://farmer-credit-scoring:8108
      VOICE_SERVICE_URL: http://farmer-voice-navigation:8109
      ML_SERVICE_URL: http://farmer-ml-service:8001
      BLOCKCHAIN_PROVENANCE_SERVICE_URL: http://farmer-blockchain-provenance:8110
      URBAN_DELIVERY_SERVICE_URL: http://farmer-urban-delivery:8111
      CEA_AI_SERVICE_URL: http://farmer-cea-ai:8112
      AQUACULTURE_POND_SERVICE_URL: http://farmer-aquaculture-pond:8113
      AQUACULTURE_FEED_SERVICE_URL: http://farmer-aquaculture-feed:8114
      AQUACULTURE_AI_SERVICE_URL: http://farmer-aquaculture-ai:8115
      CONTRACT_FARMING_SERVICE_URL: http://farmer-contract-farming:8116
      WAREHOUSE_RECEIPT_SERVICE_URL: http://farmer-warehouse-receipt:8117
      CONVERSATIONAL_COMMERCE_SERVICE_URL: http://farmer-conversational-commerce:8118
      LOAN_ORCHESTRATOR_SERVICE_URL: http://farmer-loan-orchestrator:8099
      IMAGE_SERVICE_URL: http://farmer-image-service:8080
      REALTIME_SERVICE_URL: http://farmer-realtime-service:8012
      DAPR_SERVICE_URL: http://farmer-dapr-service:8013
      DELIVERY_SERVICE_URL: http://farmer-delivery-service:8091
      DRONE_SERVICE_URL: http://farmer-drone-service:8097
      SUPPLY_CHAIN_SERVICE_URL: http://farmer-supply-chain-service:8099
      TIGERBEETLE_SERVICE_URL: http://farmer-tigerbeetle-service:8084
      MOBILE_MONEY_SERVICE_URL: http://farmer-mobile-money:8090
      MESSAGING_MIDDLEWARE_URL: http://farmer-messaging-middleware:8091
      ORCHESTRATOR_COORDINATOR_URL: http://farmer-orchestrator-coordinator:8086
      SYNC_ORCHESTRATOR_URL: http://farmer-sync-orchestrator:8090
      EQUIPMENT_FLEET_SERVICE_URL: http://farmer-equipment-fleet-service:8098
      GPS_SERVICE_URL: http://farmer-gps-service:8080
      PRICE_PREDICTION_SERVICE_URL: http://farmer-price-prediction-service:8093
      OLLAMA_SERVICE_URL: http://farmer-ollama-service:8087
      LAKEHOUSE_SERVICE_URL: http://farmer-lakehouse-service:8085
      WEATHER_SERVICE_V2_URL: http://farmer-weather-service:8069
      FEDERATED_LEARNING_SERVICE_URL: http://farmer-federated-learning:8098
      SATELLITE_SERVICE_URL: http://farmer-satellite-service:8095
      KYC_VERIFICATION_SERVICE_URL: http://farmer-kyc-verification:8104
      LOAN_WORKER_URL: http://farmer-loan-worker:8020
      TEMPORAL_WORKFLOWS_URL: http://farmer-temporal-workflows:8080
      MESSAGING_ANALYTICS_URL: http://farmer-messaging-analytics:8094
      SYNC_ANALYTICS_URL: http://farmer-sync-analytics:8091
      COLD_CHAIN_SERVICE_URL: http://farmer-cold-chain-service:8092
      INDOOR_FARMING_AI_URL: http://farmer-indoor-farming:8112
      AGRI_LLM_URL: http://farmer-agri-llm:8060
      SEDONA_SUPPLY_CHAIN_URL: http://farmer-sedona-supply-chain:8063
      AUTH_SERVICE_URL: http://farmer-auth-service:8081
      FARMER_SERVICE_URL: http://farmer-farmer-service:8082
      ANALYTICS_SERVICE_URL: http://farmer-analytics-service:8082
      AI_INSPECTION_URL: http://farmer-ai-inspection:8084
      MARKETPLACE_SERVICE_URL: http://farmer-marketplace-service:8085
      IOT_SERVICE_URL: http://farmer-iot-service:8086
      NOTIFICATION_SERVICE_URL: http://farmer-notification-service:8087
      ERP_INTEGRATION_URL: http://farmer-erp-integration:8088
      AGRICULTURAL_MODELS_URL: http://farmer-agricultural-models:8089
      MODEL_SERVING_URL: http://farmer-model-serving:8090
