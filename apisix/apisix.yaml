routes:
  - uri: /ws/track/*
    upstream:
      type: roundrobin
      nodes:
        "farmer-gps-streaming:8098": 1
    enable_websocket: true

  - uri: /ws/driver/*
    upstream:
      type: roundrobin
      nodes:
        "farmer-gps-streaming:8098": 1
    enable_websocket: true
  - uri: /*
    enable_websocket: true
    upstream:
      type: roundrobin
      nodes:
        "farmer-app:3001": 1

#END
