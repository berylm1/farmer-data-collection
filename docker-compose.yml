services:
  # ============================================================
  # LAYER 1: DATA STORES
  # ============================================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: farmer-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: farmer_data
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./drizzle/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - farmconnect-network

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.22.0
    container_name: farmer-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      PGBOUNCER_DATABASE: farmer_data
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: "statement_timeout"
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: ${DB_USER}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      POSTGRESQL_DATABASE: farmer_data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - farmconnect-network

  redis:
    image: redis:7-alpine
    container_name: farmer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --save 60 1000
      --save 300 100
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    networks:
      - farmconnect-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: farmer-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - farmconnect-network

  # ============================================================
  # LAYER 2: AUTH & ACCESS CONTROL
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: farmer-keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_PROXY: edge
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    security_opt:
      - seccomp=unconfined
    networks:
      - farmconnect-network

  permify:
    image: ghcr.io/permify/permify:latest
    container_name: farmer-permify
    restart: unless-stopped
    ports:
      - "3476:3476"
      - "3478:3478"
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/permify"
      PERMIFY_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3476/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - farmconnect-network

  # ============================================================
  # LAYER 3: SEARCH & API GATEWAY
  # ============================================================
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: farmer-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-Admin123456789!}
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - farmconnect-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: farmer-opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - farmconnect-network

  apisix:
    image: apache/apisix:3.7.0-debian
    container_name: farmer-apisix
    restart: unless-stopped
    ports:
      - "9080:9080"
      - "9443:9443"
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/apisix/status"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - farmconnect-network

  # ============================================================
  # LAYER 4: FINANCIAL & WORKFLOW
  # ============================================================
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.9
    container_name: farmer-tigerbeetle
    restart: unless-stopped
    ports:
      - "3479:3000"
    command: start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle
    volumes:
      - tigerbeetle-data:/data
    cap_add:
      - IPC_LOCK
    networks:
      - farmconnect-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    security_opt:
      - seccomp=unconfined
    networks:
      - farmconnect-network

  temporal:
    image: temporalio/auto-setup:1.23.1
    container_name: farmer-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PWD: ${DB_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address localhost:7233 cluster health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    security_opt:
      - seccomp=unconfined
    networks:
      - farmconnect-network

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: farmer-temporal-ui
    restart: unless-stopped
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    networks:
      - farmconnect-network

  fluvio:
    image: infinyon/fluvio:latest
    container_name: farmer-fluvio
    restart: unless-stopped
    ports:
      - "9003:9003"
    environment:
      FLUVIO_NODE_BIND_ADDR: 0.0.0.0:9003
    volumes:
      - fluvio-data:/var/lib/fluvio
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - farmconnect-network

  dapr-placement:
    image: daprio/dapr:1.13.0
    container_name: farmer-dapr-placement
    restart: unless-stopped
    command: ["./placement", "--port", "50005"]
    ports:
      - "50005:50005"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - farmconnect-network

  mojaloop-simulator:
    image: mojaloop/simulator:latest
    container_name: farmer-mojaloop
    restart: unless-stopped
    ports:
      - "8444:8444"
    environment:
      PARTIES_ENDPOINT: http://mojaloop-simulator:8444
      LOG_LEVEL: info
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - farmconnect-network

  # ============================================================
  # LAYER 5: OBSERVABILITY
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: farmer-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - farmconnect-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: farmer-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - farmconnect-network

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: farmer-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    networks:
      - farmconnect-network

  loki:
    image: grafana/loki:2.9.3
    container_name: farmer-loki
    restart: unless-stopped
    ports:
      - "3101:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - farmconnect-network

  vault:
    image: hashicorp/vault:1.15
    container_name: farmer-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://vault:8200"
    volumes:
      - vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    networks:
      - farmconnect-network

  # ============================================================
  # LAYER 6: MAIN API APPLICATION
  # ============================================================
  app:
    image: farmconnect/api:latest
    container_name: farmer-app
    restart: unless-stopped
    ports:
      - "3000:3001"
    environment:
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:5173,https://america.tail3a833f.ts.net"
      NODE_ENV: production
      # Route through PgBouncer (not direct to postgres)
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/farmer_data
      # Direct fallback (uncomment if pgbouncer has issues)
      # DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/farmer_data
      # Redis — provide BOTH formats since app code may use either
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Kafka
      KAFKA_BROKERS: kafka:9092
      # Auth
      KEYCLOAK_URL: http://keycloak:8080
      PERMIFY_ENDPOINT: http://permify:3476
      JWT_SECRET: ${JWT_SECRET}
      # Search
      OPENSEARCH_URL: http://opensearch:9200
      # Workflow
      TEMPORAL_ADDRESS: temporal:7233
      # Financial
      TIGERBEETLE_ADDRESS: tigerbeetle:3000
      MOJALOOP_API_URL: http://mojaloop-simulator:8444
      # Runtime
      DAPR_HOST: dapr-placement
      DAPR_HTTP_PORT: 3500
      FLUVIO_URL: http://fluvio:9003
      APISIX_ADMIN_URL: http://apisix:9180
      # Defaults
      DEFAULT_CURRENCY: NGN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - farmconnect-network

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  opensearch-data:
  tigerbeetle-data:
  fluvio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  vault-data:

networks:
  farmconnect-network:
    external: true
    name: farmer-data-collection_farmconnect-network
