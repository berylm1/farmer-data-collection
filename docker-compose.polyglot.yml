# docker-compose.polyglot.yml - Polyglot microservices for FarmConnect
# Deploy with: docker compose -f docker-compose.yml -f docker-compose.polyglot.yml up -d

services:
  # === ROOT GO SERVICES ===
  feature-flags:
    image: farmconnect/feature-flags:latest
    container_name: farmer-feature-flags
    restart: unless-stopped
    ports:
      - "8101:8101"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - farmconnect-network

  whatsapp-service:
    image: farmconnect/whatsapp-service:latest
    container_name: farmer-whatsapp-service
    restart: unless-stopped
    ports:
      - "8102:8102"
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - farmconnect-network

  qr-traceability:
    image: farmconnect/qr-traceability:latest
    container_name: farmer-qr-traceability
    restart: unless-stopped
    ports:
      - "8103:8103"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - farmconnect-network

  # === GO SERVICES (services/go/) ===
  blockchain-provenance:
    image: farmconnect/blockchain-provenance:latest
    container_name: farmer-blockchain-provenance
    restart: unless-stopped
    ports:
      - "8110:8110"
    networks:
      - farmconnect-network

  aquaculture-pond:
